name: Release
on:
  schedule:
    - cron: 23 4 2 * *
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: metio/ci/.github/workflows/maven-central-release.yml@1bcfd5d852697876af6c191fa597cf5aab22cb62 # 2026.10.31124002
    with:
      paths: src/main/java pom.xml
    secrets: inherit
